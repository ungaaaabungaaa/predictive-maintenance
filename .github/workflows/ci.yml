name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-benchmark.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check src tests
      - run: python -m pytest --cov --cov-branch --cov-fail-under=85
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist cmapss-maintenance-lab
      - run: maintenance-lab --help
      - run: maintenance-lab --version
